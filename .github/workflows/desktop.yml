name: Windows installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Версия из тега
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.TrimStart('v') } else { $v = '0.0.0-dev' }
          "DASYNC_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Зависимости
        working-directory: desktop
        run: pip install -r requirements.txt pyinstaller

      - name: Сборка DaSync.exe
        working-directory: desktop
        run: pyinstaller dasync.spec --noconfirm

      - name: Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Сборка установщика
        working-directory: desktop
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      # Подпись кода добавим сюда, когда выберем способ (см. README)

      - uses: actions/upload-artifact@v4
        with:
          name: DaSync-Setup
          path: desktop/dist/DaSync-Setup.exe

      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/DaSync-Setup.exe
          generate_release_notes: true
