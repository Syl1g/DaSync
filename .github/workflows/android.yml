name: Android APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Версия из тега
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0-dev"; fi
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"

      - name: Зависимости
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Создать Android-проект
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: Сборка APK
        working-directory: mobile/android
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${GITHUB_RUN_NUMBER}/" app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"${APP_VERSION}\"/" app/build.gradle
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g/' gradle.properties
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Переименовать
        run: cp mobile/android/app/build/outputs/apk/release/app-release.apk DaSync.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DaSync-apk
          path: DaSync.apk

      - name: Приложить к релизу
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DaSync.apk
